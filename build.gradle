plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "autobreakerclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

// OneConfig ships as a jar-in-jar bundle whose actual Fabric mod (id
// "oneconfigv1") lives nested under META-INF/jars/, alongside the API jars
// used below for compiling against it. Fabric Loader's "Incompatible mods -
// oneconfigv1 is missing" error happens because Loom's dev runtime classpath
// doesn't replicate Fabric Loader's own jar-in-jar auto-extraction for
// third-party mods the way a real packaged install does - so that nested jar
// needs to be pulled out and declared as its own mod dependency explicitly.
// Resolved eagerly (not as a lazy task) because the dependencies {} block
// below needs the extracted file's path immediately.
def oneConfigBundleForJiJ = configurations.detachedConfiguration(
        dependencies.create("maven.modrinth:oneconfig:${project.oneconfig_version}")
).resolve().first()
def oneConfigV1Jar = layout.buildDirectory.file("oneconfigv1-extracted.jar").get().asFile
oneConfigV1Jar.parentFile.mkdirs()
copy {
    from(zipTree(oneConfigBundleForJiJ)) {
        include "META-INF/jars/${project.minecraft_version}-fabric-*.jar"
    }
    into oneConfigV1Jar.parentFile
    eachFile { it.path = oneConfigV1Jar.name }
    includeEmptyDirs = false
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    modImplementation "maven.modrinth:compose-multiplatform:${project.compose_multiplatform_version}"
    modImplementation "maven.modrinth:oneconfig:${project.oneconfig_version}"
    modImplementation files(oneConfigV1Jar)
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

kotlin {
    jvmToolchain(21)
}

// OneConfig and Compose Multiplatform ship as jar-in-jar bundles: the real
// API classes (org.polyfrost.oneconfig.api.config.v1.*, etc.) live inside
// nested jars under META-INF/jars/ that Fabric Loader only extracts at
// runtime. Loom's mod dependency handling exposes the outer bundle jar, but
// neither javac nor kotlinc can see into a jar nested inside another jar, so
// compiling against the real API needs those inner jars extracted and added
// to the compile classpath explicitly.
def composeBundle = configurations.detachedConfiguration(
        dependencies.create("maven.modrinth:compose-multiplatform:${project.compose_multiplatform_version}")
).resolve().first()

def modCompileLibsDir = layout.buildDirectory.dir("modCompileLibs")
def extractModCompileLibs = tasks.register("extractModCompileLibs") {
    inputs.files(oneConfigBundleForJiJ, composeBundle)
    outputs.dir(modCompileLibsDir)
    doLast {
        def outDir = modCompileLibsDir.get().asFile
        outDir.mkdirs()
        [oneConfigBundleForJiJ, composeBundle].each { bundle ->
            copy {
                from(zipTree(bundle)) {
                    include "META-INF/jars/*.jar"
                    eachFile { it.path = it.name }
                    includeEmptyDirs = false
                }
                into outDir
            }
        }
    }
}
def modCompileLibs = fileTree(modCompileLibsDir) {
    include "*.jar"
    builtBy extractModCompileLibs
}

afterEvaluate {
    sourceSets.client.compileClasspath += modCompileLibs
    tasks.named('compileClientJava').configure {
        dependsOn extractModCompileLibs
        classpath += modCompileLibs
    }
    tasks.named('compileClientKotlin', org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configure {
        dependsOn extractModCompileLibs
        libraries.from(modCompileLibs)
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
