plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "autobreakerclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

// OneConfig ships as a jar-in-jar bundle: every one of its real Fabric mods
// (43 of them) lives nested under META-INF/jars/, each with its own
// fabric.mod.json. A real packaged install has Fabric Loader auto-extract
// these at launch, but Loom's dev runtime classpath doesn't replicate that
// for third-party mods - that's the cause of the "Incompatible mods -
// oneconfigv1 is missing" screen (oneconfigv1 is OneConfig's actual runtime).
//
// Also tried, and backed out: adding org.polyfrost.compose's bridge jar
// ("poly-compose", needed by OneConfigPreLaunch for
// org/polyfrost/compose/render/PolyBitmap) on top of this. That made
// compileClientJava fail on "class file for
// net.kyori.adventure.platform.modcommon.IdentifiedAtRuntime not found" -
// a class that, as far as this investigation got, doesn't exist in either
// bundle's 82 nested jars, nor on Maven Central under any group/artifact
// name, nor in poly-compose's own bytecode. The actual source of that
// requirement is still unclear (most likely something Loom's dev
// environment synthesizes once enough entity-mixin-carrying mods are
// present), so poly-compose is left out until that's actually understood -
// see the project README for the current status of the PolyBitmap crash.
def oneConfigBundleForJiJ = configurations.detachedConfiguration(
        dependencies.create("maven.modrinth:oneconfig:${project.oneconfig_version}")
).resolve().first()

// Two different needs pull in two different, non-overlapping subsets of
// OneConfig's 43 nested jars:
//  - RUNTIME needs "oneconfigv1" (its actual Fabric mod) registered as its
//    own mod dependency, or Fabric Loader reports it as missing.
//  - COMPILE TIME needs "config"/"config-impl" (where Tree/Property/Config/
//    ConfigEntrypoint - the classes AutoBreakerConfig.kt actually imports -
//    live) on the classpath, but NOT registered as modImplementation: doing
//    that for "poly-compose" (OneConfigPreLaunch's org.polyfrost.compose
//    bridge, needed for a NoClassDefFoundError on
//    org/polyfrost/compose/render/PolyBitmap) pulled in a
//    "net.kyori.adventure.platform.modcommon" class that doesn't exist
//    anywhere in either bundle's jars nor on Maven Central under any name -
//    still unresolved, so poly-compose is deliberately left out of both
//    sets for now; see the README for the current status of that crash.
def jarInJarDir = layout.buildDirectory.dir("jarInJar").get().asFile
// delete + copy, not sync (sync isn't available as a Project method on this
// Gradle version) and not plain copy (which never deletes stale files from a
// previous invocation - jars extracted by an *earlier* version of this
// block, like poly-compose during troubleshooting, silently kept sitting in
// this directory and kept getting picked back up by the fileTrees below
// regardless of the current include patterns, which was a real, confusing
// bug here).
delete jarInJarDir
jarInJarDir.mkdirs()
copy {
    from(zipTree(oneConfigBundleForJiJ)) {
        include "META-INF/jars/${project.minecraft_version}-fabric-*.jar" // oneconfigv1 (runtime)
        include "META-INF/jars/config-*.jar" // config + config-impl (compile-time API)
    }
    into jarInJarDir
    eachFile { it.path = it.name }
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
def runtimeModJars = fileTree(jarInJarDir) { include "${project.minecraft_version}-fabric-*.jar" }
def compileOnlyApiJars = fileTree(jarInJarDir) { include "config-*.jar" }

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    modImplementation "maven.modrinth:compose-multiplatform:${project.compose_multiplatform_version}"
    modImplementation "maven.modrinth:oneconfig:${project.oneconfig_version}"
    runtimeModJars.files.each { jarFile ->
        modImplementation files(jarFile)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

kotlin {
    jvmToolchain(21)
}

// Neither javac nor kotlinc can see into a jar nested inside another jar
// either, so compileOnlyApiJars (extracted above) needs to be on the compile
// classpath for the real org.polyfrost.oneconfig.api.config.v1.* classes
// (Tree, Property, Config, ConfigEntrypoint) to resolve.
afterEvaluate {
    sourceSets.client.compileClasspath += compileOnlyApiJars
    tasks.named('compileClientJava').configure {
        classpath += compileOnlyApiJars
    }
    tasks.named('compileClientKotlin', org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configure {
        libraries.from(compileOnlyApiJars)
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
