# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.20.1
# Mod Properties
mod_version=1.0.0-beta.1
maven_group=jevmc.org.example
archives_base_name=autobreakerclient
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.141.6+1.21.11
fabric_language_kotlin_version=1.14.2+kotlin.2.4.21
compose_multiplatform_version=bMhjbdhu
oneconfig_version=6AuGXqDS
# poly-compose (bundled inside the oneconfig/compose-multiplatform jars) needs this exact
# version of adventure-platform-fabric at both compile and runtime; pulling it as a real
# Maven Central dependency (instead of extracting it from the bundle) brings in its
# transitive deps too (adventure-api, adventure-key, adventure-platform-mod-shared-fabric-repack)
adventure_platform_fabric_version=6.8.0
# poly-compose's PolyBitmap registers these TwelveMonkeys ImageIO plugins at startup
# (com.twelvemonkeys.imageio:imageio-webp/imageio-bmp); same reasoning as adventure-platform-fabric
# above - real Maven Central deps so their own transitive deps (imageio-core, imageio-metadata)
# are resolved properly instead of extracting a single opaque jar from the bundle.
twelvemonkeys_imageio_version=3.15.3
